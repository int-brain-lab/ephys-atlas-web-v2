<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q14 guided distribution review</title><style>
:root{color-scheme:dark;font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;background:#091117;color:#e9f0f4;--panel:#101b23;--soft:#14232d;--line:#29404e;--muted:#91a5b0;--accent:#55c3dc;--good:#75d59d}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,select,textarea{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:9px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:none}button:disabled{cursor:default;opacity:.4}kbd{min-width:1.7rem;padding:.1rem .38rem;border:1px solid #557080;border-bottom-width:2px;border-radius:5px;background:#0b151c;color:#dce9ef;font:700 .76rem/1.35 inherit;text-align:center}.shell{width:min(980px,calc(100% - 32px));margin:auto;padding-bottom:88px}header{padding:24px 0 14px}.topline,.progress-row,.nav-row,.choices,.shortcuts,.edit-actions{display:flex;align-items:center;gap:10px}.topline{justify-content:space-between}h1{margin:0;font-size:1.1rem}.local{color:#ffd98b;font-size:.82rem}.progress-row{margin-top:18px}.progress-track{flex:1;height:5px;overflow:hidden;border-radius:5px;background:#1b2b34}.progress-fill{height:100%;background:var(--good);transition:width .2s}.progress-label{min-width:115px;color:var(--muted);font-size:.84rem;text-align:right}main{padding-top:14px}.review-card{transition:opacity .1s,transform .1s}.review-card.switching{opacity:.2;transform:translateX(8px)}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}h2{margin:5px 0 3px;font-size:clamp(1.55rem,4vw,2.2rem);overflow-wrap:anywhere}.source{margin:0 0 22px;color:var(--muted)}.question{margin:0 0 14px;font-size:1.08rem}.choices{align-items:stretch}.decision{flex:1;min-height:142px;padding:17px;text-align:left;background:var(--panel)}.decision.recommended{border-color:#2e7182;background:linear-gradient(145deg,#123642,var(--panel))}.decision.selected{box-shadow:inset 0 0 0 2px var(--good)}.decision-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750}.decision-label{display:block;margin-top:5px;color:var(--muted);font-size:.82rem}.decision-value{display:block;margin-top:11px;line-height:1.6}.tag{color:var(--accent);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}.nav-row{justify-content:space-between;margin-top:15px}.quiet{padding:7px 10px;color:var(--muted);background:transparent}.why,.editor{margin-top:14px;padding:15px 17px;border:1px solid var(--line);border-radius:10px;background:#0c171e}.why[hidden],.editor[hidden],#review[hidden],#complete[hidden]{display:none}.reason{margin:0 0 12px;color:#c8d5dc}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.metric{padding:9px 11px;border-radius:7px;background:var(--soft)}.metric span{display:block;color:var(--muted);font-size:.75rem}.chart{height:180px;border-radius:7px;overflow:hidden;background:#071016}.chart svg{width:100%;height:100%}.bar{fill:#55c3dc}.axis{stroke:#78909d;stroke-width:1}.editor{border-color:var(--accent);background:var(--panel)}.editor h3{margin:0 0 12px}fieldset{margin:10px 0;padding:0;border:0}legend{margin-bottom:5px;font-weight:700}label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;color:#c9d5db}input{accent-color:var(--accent)}select{padding:6px 8px}textarea{display:block;width:100%;min-height:66px;margin-top:6px;padding:8px;resize:vertical}.edit-actions{justify-content:flex-end;margin-top:12px}.primary{padding:8px 13px;color:#071017;border-color:var(--accent);background:var(--accent);font-weight:750}.complete{max-width:620px;margin:12vh auto 0;padding:28px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.complete p{color:var(--muted)}.complete .primary{margin-top:10px;padding:11px 18px}.shortcuts{position:fixed;z-index:4;left:0;right:0;bottom:0;justify-content:center;min-height:58px;padding:10px 16px;border-top:1px solid var(--line);background:#091117f2;backdrop-filter:blur(12px);color:var(--muted);font-size:.82rem}.shortcut{display:inline-flex;align-items:center;gap:5px}@media(max-width:680px){.shell{width:min(100% - 22px,980px)}.choices{flex-direction:column}.decision{min-height:110px}.metrics{grid-template-columns:1fr 1fr}.shortcuts{justify-content:flex-start;overflow-x:auto;white-space:nowrap}.optional{display:none}}
</style></head><body><div class="shell"><header><div class="topline"><h1>Distribution review</h1><span class="local">Local proposal · no production effect</span></div><div class="progress-row"><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div><span id="progress-label" class="progress-label"></span></div></header><main>
<section id="review" class="review-card"><div id="eyebrow" class="eyebrow"></div><h2 id="feature-title"></h2><p id="source" class="source"></p><p class="question">Which presentation should this feature use?</p><div class="choices"><button id="choose-recommendation" class="decision recommended"><span class="decision-title">Use recommendation <kbd>R</kbd></span><span class="decision-label"><span class="tag">Recommended</span></span><span id="recommendation-value" class="decision-value"></span></button><button id="choose-current" class="decision"><span class="decision-title">Keep current <kbd>C</kbd></span><span class="decision-label">No change to the accepted baseline</span><span id="current-value" class="decision-value"></span></button></div><div class="nav-row"><button id="previous" class="quiet">← Previous</button><button id="toggle-why" class="quiet">Why this recommendation? <kbd>W</kbd></button><button id="next" class="quiet">Skip for now →</button></div><section id="why" class="why" hidden></section><section id="editor" class="editor" hidden><h3>Edit this choice</h3><div id="editor-controls"></div><label>Optional note<textarea id="notes" placeholder="Reason or requested follow-up"></textarea></label><div class="edit-actions"><button id="cancel-edit" class="quiet">Cancel</button><button id="save-edit" class="primary">Save edit</button></div></section></section>
<section id="complete" class="complete" hidden><div class="eyebrow">Review complete</div><h2>All proposed changes reviewed</h2><p id="complete-summary"></p><button id="download" class="primary">Download review record <kbd>D</kbd></button><p><button id="review-again" class="quiet">Review decisions again</button></p></section></main></div>
<footer class="shortcuts" aria-label="Keyboard shortcuts"><span class="shortcut"><kbd>R</kbd> recommendation</span><span class="shortcut"><kbd>C</kbd> current</span><span class="shortcut"><kbd>E</kbd> edit</span><span class="shortcut optional"><kbd>W</kbd> evidence</span><span class="shortcut"><kbd>←</kbd><kbd>→</kbd> move</span></footer>
<script type="application/json" id="report-data">__DISTRIBUTION_REVIEW_LAB_DATA__</script><script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id),clone=value=>JSON.parse(JSON.stringify(value)),equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const all=report.datasets.flatMap(dataset=>dataset.features.map(feature=>({dataset,feature}))),queue=all.filter(item=>!equal(item.feature.accepted_baseline,item.feature.agent_proposal)),decisions=new Map(),dispositions=new Map(),notes=new Map(),key=item=>item.dataset.dataset_id+'\0'+item.feature.id;
for(const item of all)decisions.set(key(item),clone(item.feature.agent_proposal));let index=0,editing=false,whyOpen=false;
const kinds=(display,field)=>display[field].map(item=>item.kind),current=()=>queue[index],reviewedCount=()=>queue.filter(item=>dispositions.has(key(item))).length;
function displayText(display){const name=x=>x==='symlog'?'Signed log':x[0].toUpperCase()+x.slice(1),scale=kinds(display,'scales').map(name).join(' + '),domain=kinds(display,'distribution_domains').map(name).join(' + ');return `${scale}<br>${domain}<br><strong>Default: ${name(display.preferred_scale)} · ${name(display.preferred_distribution_domain)}</strong>`}
function format(value){if(value===null||value===undefined)return '—';if(typeof value==='number')return Math.abs(value)>=1e4||(Math.abs(value)>0&&Math.abs(value)<1e-3)?value.toExponential(3):value.toLocaleString(undefined,{maximumSignificantDigits:6});return String(value)}
function render(){if(!queue.length||reviewedCount()===queue.length){renderComplete();return}$('complete').hidden=true;$('review').hidden=false;const item=current(),feature=item.feature,decision=decisions.get(key(item)),disposition=dispositions.get(key(item));$('eyebrow').textContent=`${item.dataset.dataset_id.replaceAll('_',' ')} · recommendation ${index+1} of ${queue.length}`;$('feature-title').textContent=feature.id;$('source').textContent=item.dataset.source_release_id;$('recommendation-value').innerHTML=displayText(feature.agent_proposal);$('current-value').innerHTML=displayText(feature.accepted_baseline);$('choose-recommendation').classList.toggle('selected',disposition==='accept-proposal');$('choose-current').classList.toggle('selected',disposition==='retain-baseline');$('previous').disabled=index===0;$('next').textContent=index===queue.length-1?'Back to first':'Skip for now →';$('why').hidden=!whyOpen;if(whyOpen)renderWhy(item);$('editor').hidden=!editing;if(editing)renderEditor(item,decision);const reviewed=reviewedCount();$('progress-fill').style.width=`${reviewed/queue.length*100}%`;$('progress-label').textContent=`${reviewed} of ${queue.length} decided`}
function renderComplete(){$('review').hidden=true;$('complete').hidden=false;$('progress-fill').style.width='100%';$('progress-label').textContent=`${queue.length} of ${queue.length} decided`;const count=value=>[...dispositions.values()].filter(item=>item===value).length;$('complete-summary').textContent=`${count('accept-proposal')} recommendations accepted · ${count('retain-baseline')} current settings retained · ${count('edited')} edited. The other ${all.length-queue.length} features are unchanged.`}
function switchTo(next){const card=$('review');card.classList.add('switching');setTimeout(()=>{index=Math.max(0,Math.min(queue.length-1,next));editing=false;whyOpen=false;card.classList.remove('switching');render()},100)}
function advance(){const next=queue.findIndex((item,position)=>position>index&&!dispositions.has(key(item)));if(next>=0){switchTo(next);return}const first=queue.findIndex(item=>!dispositions.has(key(item)));if(first>=0){switchTo(first);return}renderComplete()}
function choose(disposition){const item=current();decisions.set(key(item),clone(disposition==='accept-proposal'?item.feature.agent_proposal:item.feature.accepted_baseline));dispositions.set(key(item),disposition);advance()}
function histogramFor(item){const feature=item.feature,display=decisions.get(key(item)),scale=display.preferred_scale,domain=display.preferred_distribution_domain,candidate=feature.audit.candidates;if(domain==='full'){if(scale==='linear')return candidate.full.linear.histogram;if(scale==='log')return candidate.full.log.histogram;const threshold=display.scales.find(x=>x.kind==='symlog').linear_threshold;return candidate.full.symlog.threshold_candidates.find(x=>x.linear_threshold===threshold)?.histogram}if(scale==='linear')return candidate.focused.variants.linear.histogram;if(scale==='log')return candidate.focused.variants.log.histogram;const threshold=display.scales.find(x=>x.kind==='symlog').linear_threshold;return candidate.focused.variants.symlog.threshold_candidates.find(x=>x.linear_threshold===threshold)?.histogram}
function chart(histogram){if(!histogram)return '<p>No audited histogram exists for this combination.</p>';const width=700,height=170,max=Math.max(...histogram.counts,1),barWidth=width/histogram.counts.length,bars=histogram.counts.map((count,i)=>`<rect class="bar" x="${i*barWidth}" y="${height-count/max*(height-12)}" width="${Math.max(1,barWidth-.7)}" height="${count/max*(height-12)}"><title>${format(histogram.edges[i])} to ${format(histogram.edges[i+1])}: ${format(count)}</title></rect>`).join('');return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Exact audited histogram">${bars}<line class="axis" x1="0" y1="${height-.5}" x2="${width}" y2="${height-.5}"/></svg></div><small>${format(histogram.edges[0])} → ${format(histogram.edges.at(-1))}</small>`}
function renderWhy(item){const audit=item.feature.audit,counts=audit.value_counts,summary=audit.summary;$('why').innerHTML=`<p class="reason">${item.feature.rationale.slice(1).join(' ')}</p><div class="metrics"><div class="metric"><span>Largest Full bin</span><strong>${(audit.diagnostics.full_linear_largest_bin_fraction*100).toFixed(1)}%</strong></div><div class="metric"><span>Finite values</span><strong>${format(counts.finite_count)}</strong></div><div class="metric"><span>q01 → q99</span><strong>${format(summary.q01)} → ${format(summary.q99)}</strong></div></div>${chart(histogramFor(item))}`}
function checkbox(label,checked,disabled,onchange){const wrapper=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=checked;input.disabled=disabled;input.onchange=()=>onchange(input.checked);wrapper.append(input,document.createTextNode(label));return wrapper}
function selectControl(values,currentValue,onchange){const select=document.createElement('select');for(const value of values){const option=document.createElement('option');option.value=value;option.textContent=value==='symlog'?'Signed log':value[0].toUpperCase()+value.slice(1);select.append(option)}select.value=currentValue;select.onchange=()=>onchange(select.value);return select}
function reconcile(display){const scales=kinds(display,'scales'),domains=kinds(display,'distribution_domains');if(!scales.includes(display.preferred_scale))display.preferred_scale='linear';if(!domains.includes(display.preferred_distribution_domain))display.preferred_distribution_domain='full'}
function renderEditor(item,display){const host=$('editor-controls'),feature=item.feature,full=feature.audit.candidates.full,focused=feature.audit.candidates.focused;host.replaceChildren();const rerender=()=>{reconcile(display);renderEditor(item,display)},scaleSet=new Set(kinds(display,'scales')),domainSet=new Set(kinds(display,'distribution_domains')),scaleField=document.createElement('fieldset');scaleField.innerHTML='<legend>Available scales</legend>';scaleField.append(checkbox('Linear',true,true,()=>{}));if(full.log.availability==='available')scaleField.append(checkbox('Log',scaleSet.has('log'),false,on=>{if(on)display.scales.push({kind:'log'});else display.scales=display.scales.filter(x=>x.kind!=='log');rerender()}));const thresholds=full.symlog.threshold_candidates;if(thresholds.length){scaleField.append(checkbox('Signed log',scaleSet.has('symlog'),false,on=>{if(on)display.scales.push({kind:'symlog',linear_threshold:thresholds[Math.floor(thresholds.length/2)].linear_threshold});else display.scales=display.scales.filter(x=>x.kind!=='symlog');rerender()}));if(scaleSet.has('symlog'))scaleField.append(' threshold ',selectControl(thresholds.map(x=>String(x.linear_threshold)),String(display.scales.find(x=>x.kind==='symlog').linear_threshold),value=>{display.scales.find(x=>x.kind==='symlog').linear_threshold=Number(value)}))}host.append(scaleField);const domainField=document.createElement('fieldset');domainField.innerHTML='<legend>Available domains</legend>';domainField.append(checkbox('Full',true,true,()=>{}));if(focused.bounds.upper>focused.bounds.lower)domainField.append(checkbox(`Focused (${format(focused.bounds.lower)} → ${format(focused.bounds.upper)})`,domainSet.has('focused'),false,on=>{if(on)display.distribution_domains.push({kind:'focused',bounds:[focused.bounds.lower,focused.bounds.upper]});else display.distribution_domains=display.distribution_domains.filter(x=>x.kind!=='focused');rerender()}));host.append(domainField);const preferred=document.createElement('fieldset');preferred.innerHTML='<legend>Defaults</legend>';preferred.append('Scale ',selectControl(kinds(display,'scales'),display.preferred_scale,value=>display.preferred_scale=value),' Domain ',selectControl(kinds(display,'distribution_domains'),display.preferred_distribution_domain,value=>display.preferred_distribution_domain=value));host.append(preferred);$('notes').value=notes.get(key(item))||''}
function openEditor(){editing=true;whyOpen=false;render()}
function record(){return{format:'ibl-scalar-distribution-human-review-v1',source_lab:{format:report.format,policy_version:report.policy_version},production_effect:'none',datasets:report.datasets.map(dataset=>({dataset_id:dataset.dataset_id,representation:dataset.representation,source_release_id:dataset.source_release_id,audit_sha256:dataset.audit_sha256,accepted_selection_id:dataset.accepted_selection_id,accepted_selection_sha256:dataset.accepted_selection_sha256,features:dataset.features.map(feature=>{const item={dataset,feature},unchanged=equal(feature.accepted_baseline,feature.agent_proposal);return{id:feature.id,disposition:unchanged?'unchanged-baseline':dispositions.get(key(item))||'unreviewed',display:clone(decisions.get(key(item))),notes:notes.get(key(item))||''}})}))}}
function download(){const anchor=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(record(),null,2)],{type:'application/json'}));anchor.href=url;anchor.download='q14-distribution-human-review.json';anchor.click();URL.revokeObjectURL(url)}
$('choose-recommendation').onclick=()=>choose('accept-proposal');$('choose-current').onclick=()=>choose('retain-baseline');$('previous').onclick=()=>switchTo(index-1);$('next').onclick=()=>switchTo(index+1<queue.length?index+1:0);$('toggle-why').onclick=()=>{whyOpen=!whyOpen;editing=false;render()};$('cancel-edit').onclick=()=>{decisions.set(key(current()),clone(current().feature.agent_proposal));editing=false;render()};$('save-edit').onclick=()=>{notes.set(key(current()),$('notes').value);dispositions.set(key(current()),'edited');editing=false;advance()};$('download').onclick=download;$('review-again').onclick=()=>{index=0;render()};
document.addEventListener('keydown',event=>{if(event.metaKey||event.ctrlKey||event.altKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(!$('complete').hidden){if(event.key.toLowerCase()==='d')download();return}const name=event.key.toLowerCase();if(name==='r')choose('accept-proposal');else if(name==='c')choose('retain-baseline');else if(name==='e')openEditor();else if(name==='w')$('toggle-why').click();else if(event.key==='ArrowLeft'&&index>0)switchTo(index-1);else if(event.key==='ArrowRight')switchTo(index+1<queue.length?index+1:0)});render();
</script></body></html>
