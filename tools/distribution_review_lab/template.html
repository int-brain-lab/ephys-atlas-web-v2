<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q14 distribution review lab</title><style>
:root{color-scheme:dark;font:15px/1.45 system-ui,sans-serif;background:#081119;color:#e4edf3;--panel:#101e29;--panel2:#0b1720;--line:#2e4657;--muted:#9bb0bd;--accent:#48bdd8;--good:#6fd49a;--warn:#f2c66d}*{box-sizing:border-box}body{margin:0}header,main{max-width:1500px;margin:auto;padding:18px}header{border-bottom:1px solid var(--line)}h1,h2,h3,p{margin-top:0}.guard{padding:10px 13px;border:1px solid #82672d;border-radius:8px;background:#2b2414;color:#ffe0a0}.toolbar,.tabs,.filters,.actions,.choices{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar{position:sticky;top:0;z-index:5;background:#081119f2;padding:12px 0;border-bottom:1px solid var(--line)}button,input,select,textarea{font:inherit;color:inherit;background:#142735;border:1px solid #405b6d;border-radius:6px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.active{background:#15526a;border-color:var(--accent)}input[type=search]{min-width:260px}.filters label,.choices label{display:flex;gap:5px;align-items:center;color:var(--muted)}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(250px,360px) minmax(0,1fr);gap:14px;margin-top:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.list{max-height:calc(100vh - 185px);overflow:auto}.feature{display:block;width:100%;text-align:left;margin:0 0 5px;background:var(--panel2)}.feature small{display:block;color:var(--muted)}.feature.reviewed{border-left:4px solid var(--good)}.feature.diff:not(.reviewed){border-left:4px solid var(--warn)}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.metric{background:var(--panel2);padding:8px;border-radius:6px}.metric span{display:block;color:var(--muted);font-size:.82rem}.metric strong{overflow-wrap:anywhere}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.accepted{border-top:3px solid #6e8290}.proposal{border-top:3px solid var(--accent)}.choices{margin:8px 0}.choice-group{border:0;padding:0;margin:8px 0}.choice-group legend{font-weight:700}.chart{height:245px;background:#071019;border:1px solid var(--line);border-radius:7px;position:relative}.chart svg{width:100%;height:100%}.bar{fill:#48bdd8}.axis{stroke:#7890a0;stroke-width:1}.tail{color:var(--warn);margin-top:5px}.rationale{color:var(--muted)}textarea{width:100%;min-height:70px;resize:vertical}.badge{display:inline-block;border:1px solid currentColor;border-radius:20px;padding:2px 8px;font-size:.82rem;color:var(--muted)}.empty{color:var(--muted);padding:25px}@media(max-width:850px){.layout,.comparison{grid-template-columns:1fr}.list{max-height:320px}.toolbar{position:static}}
</style></head><body><header><h1>Q14 distribution review lab</h1><p>Inspect exact audited histogram candidates and review an advisory per-feature proposal.</p><p class="guard">Local review only. Agent proposals are not scientific selections. This page cannot edit selections, build releases, publish data, or record production approval.</p></header><main>
<div class="toolbar"><div id="tabs" class="tabs"></div><input id="search" type="search" placeholder="Search features…" aria-label="Search features"><div class="filters"><label><input id="only-diff" type="checkbox"> Proposal differs</label><label><input id="only-unreviewed" type="checkbox"> Unreviewed</label><label><input id="only-log" type="checkbox"> Log eligible</label><label><input id="only-mixed" type="checkbox"> Mixed sign</label><label>Full bin ≥ <select id="collapse"><option value="0">any</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.8">80%</option><option value="0.9">90%</option></select></label></div><button id="download">Download review record</button></div>
<div class="layout"><aside class="card list"><p id="progress"></p><div id="features"></div></aside><section id="detail" class="card"></section></div>
</main><script type="application/json" id="report-data">__DISTRIBUTION_REVIEW_LAB_DATA__</script><script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent),$=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const decisions=new Map(),notes=new Map(),dispositions=new Map();let dataset=report.datasets[0],selected=null;
for(const d of report.datasets)for(const f of d.features)decisions.set(d.dataset_id+'\0'+f.id,clone(f.agent_proposal));
const key=f=>dataset.dataset_id+'\0'+f.id,scales=d=>d.scales.map(x=>x.kind),domains=d=>d.distribution_domains.map(x=>x.kind),equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function format(x){if(x===null||x===undefined)return '—';if(typeof x==='number')return Math.abs(x)>=1e4||(Math.abs(x)>0&&Math.abs(x)<1e-3)?x.toExponential(4):x.toLocaleString(undefined,{maximumSignificantDigits:7});return String(x)}
function eligibleLog(f){return f.audit.candidates.full.log.availability==='available'}function mixed(f){const c=f.audit.value_counts;return c.negative_count>0&&c.positive_count>0}function collapse(f){return f.audit.diagnostics.full_linear_largest_bin_fraction}
function visible(f){const q=$('search').value.toLowerCase();if(q&&!f.id.toLowerCase().includes(q))return false;if($('only-diff').checked&&equal(f.accepted_baseline,f.agent_proposal))return false;if($('only-unreviewed').checked&&dispositions.has(key(f)))return false;if($('only-log').checked&&!eligibleLog(f))return false;if($('only-mixed').checked&&!mixed(f))return false;return collapse(f)>=Number($('collapse').value)}
function tabs(){$('tabs').replaceChildren();for(const d of report.datasets){const b=document.createElement('button');b.textContent=`${d.dataset_id} (${d.features.length})`;b.classList.toggle('active',d===dataset);b.onclick=()=>{dataset=d;selected=null;tabs();renderList()};$('tabs').append(b)}}
function renderList(){const shown=dataset.features.filter(visible),reviewed=dataset.features.filter(f=>dispositions.has(dataset.dataset_id+'\0'+f.id)).length;$('progress').textContent=`${reviewed}/${dataset.features.length} reviewed · ${shown.length} shown`;$('features').replaceChildren();for(const f of shown){const b=document.createElement('button');b.className='feature'+(dispositions.has(key(f))?' reviewed':'')+(!equal(f.accepted_baseline,f.agent_proposal)?' diff':'');b.innerHTML=`<strong>${f.id}</strong><small>largest Full bin ${(collapse(f)*100).toFixed(1)}% · ${eligibleLog(f)?'Log eligible':'no Log'} · ${mixed(f)?'mixed sign':'one-sided'}</small>`;b.onclick=()=>{selected=f;renderList();renderDetail()};b.classList.toggle('active',selected===f);$('features').append(b)}if(!shown.length)$('features').innerHTML='<p class="empty">No matching features.</p>';if(!selected||!shown.includes(selected))selected=shown[0]||null;renderDetail()}
function displayText(d){return `${scales(d).join(', ')} · ${domains(d).join(', ')} · preferred ${d.preferred_scale}/${d.preferred_distribution_domain}`}
function metric(label,value){return `<div class="metric"><span>${label}</span><strong>${format(value)}</strong></div>`}
function scaleObject(d,kind){return d.scales.find(x=>x.kind===kind)}function domainObject(d,kind){return d.distribution_domains.find(x=>x.kind===kind)}
function histogram(f,scale,domain){const a=f.audit.candidates;if(domain==='full'){if(scale==='linear')return a.full.linear.histogram;if(scale==='log')return a.full.log.histogram;const c=scaleObject(decisions.get(key(f)),'symlog')?.linear_threshold;return a.full.symlog.threshold_candidates.find(x=>x.linear_threshold===c)?.histogram}const v=a.focused.variants;if(scale==='linear')return v.linear.histogram;if(scale==='log')return v.log.histogram;const c=scaleObject(decisions.get(key(f)),'symlog')?.linear_threshold;return v.symlog.threshold_candidates.find(x=>x.linear_threshold===c)?.histogram}
function chart(f,scale,domain){const h=histogram(f,scale,domain);if(!h)return '<p class="empty">No exact audited histogram for this choice.</p>';const max=Math.max(...h.counts,1),w=700,height=210,bw=w/h.counts.length;const bars=h.counts.map((c,i)=>`<rect class="bar" x="${i*bw}" y="${height-c/max*(height-16)}" width="${Math.max(1,bw-.8)}" height="${c/max*(height-16)}"><title>${format(h.edges[i])} to ${format(h.edges[i+1])}: ${format(c)}</title></rect>`).join('');return `<div class="chart"><svg viewBox="0 0 ${w} ${height}" role="img" aria-label="Exact ${scale} ${domain} histogram">${bars}<line class="axis" x1="0" y1="${height-.5}" x2="${w}" y2="${height-.5}"/></svg></div><p>${format(h.edges[0])} → ${format(h.edges[h.edges.length-1])}</p>`}
function checkbox(label,checked,disabled,onchange){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=checked;i.disabled=disabled;i.onchange=()=>onchange(i.checked);l.append(i,document.createTextNode(label));return l}
function selectControl(values,current,onchange){const s=document.createElement('select');for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v==='symlog'?'Signed log':v[0].toUpperCase()+v.slice(1);s.append(o)}s.value=current;s.onchange=()=>onchange(s.value);return s}
function proposalControls(f,host){const d=decisions.get(key(f)),full=f.audit.candidates.full,focused=f.audit.candidates.focused;const scaleSet=new Set(scales(d)),domainSet=new Set(domains(d));const changed=()=>{dispositions.delete(key(f));reconcile(f);renderList()};const scaleBox=document.createElement('fieldset');scaleBox.className='choice-group';scaleBox.innerHTML='<legend>Available scales</legend>';scaleBox.append(checkbox('Linear',true,true,()=>{}));if(full.log.availability==='available')scaleBox.append(checkbox('Log',scaleSet.has('log'),false,on=>{if(on)d.scales.push({kind:'log'});else d.scales=d.scales.filter(x=>x.kind!=='log');changed()}));const thresholds=full.symlog.threshold_candidates;if(thresholds.length){scaleBox.append(checkbox('Signed log',scaleSet.has('symlog'),false,on=>{if(on)d.scales.push({kind:'symlog',linear_threshold:thresholds[Math.floor(thresholds.length/2)].linear_threshold});else d.scales=d.scales.filter(x=>x.kind!=='symlog');changed()}));if(scaleSet.has('symlog')){const cs=selectControl(thresholds.map(x=>String(x.linear_threshold)),String(scaleObject(d,'symlog').linear_threshold),value=>{scaleObject(d,'symlog').linear_threshold=Number(value);changed()});cs.setAttribute('aria-label','Signed-log threshold');scaleBox.append(cs)}}host.append(scaleBox);
const domainBox=document.createElement('fieldset');domainBox.className='choice-group';domainBox.innerHTML='<legend>Distribution domains</legend>';domainBox.append(checkbox('Full',true,true,()=>{}));if(focused.bounds.upper>focused.bounds.lower)domainBox.append(checkbox(`Focused [${format(focused.bounds.lower)}, ${format(focused.bounds.upper)}]`,domainSet.has('focused'),false,on=>{if(on)d.distribution_domains.push({kind:'focused',bounds:[focused.bounds.lower,focused.bounds.upper]});else d.distribution_domains=d.distribution_domains.filter(x=>x.kind!=='focused');changed()}));host.append(domainBox);
const preferred=document.createElement('div');preferred.className='choices';preferred.append('Preferred scale ',selectControl(scales(d),d.preferred_scale,value=>{d.preferred_scale=value;changed()}),' Preferred domain ',selectControl(domains(d),d.preferred_distribution_domain,value=>{d.preferred_distribution_domain=value;changed()}));host.append(preferred)}
function reconcile(f){const d=decisions.get(key(f));if(!scales(d).includes(d.preferred_scale))d.preferred_scale='linear';if(!domains(d).includes(d.preferred_distribution_domain))d.preferred_distribution_domain='full'}
function renderDetail(){const host=$('detail');host.replaceChildren();if(!selected){host.innerHTML='<p class="empty">Select a feature.</p>';return}const f=selected,d=decisions.get(key(f)),a=f.audit,c=a.value_counts,s=a.summary,focus=a.candidates.focused;host.innerHTML=`<h2>${f.id} <span class="badge">${dataset.representation}</span></h2><p>${dataset.dataset_id} · ${dataset.source_release_id}</p><div class="meta">${metric('Finite',c.finite_count)}${metric('Missing',c.missing_count)}${metric('Negative / zero / positive',`${format(c.negative_count)} / ${format(c.zero_count)} / ${format(c.positive_count)}`)}${metric('Min / median / max',`${format(s.min)} / ${format(s.q50)} / ${format(s.max)}`)}${metric('q01 / q99',`${format(s.q01)} / ${format(s.q99)}`)}${metric('Full largest bin',(collapse(f)*100).toFixed(3)+'%')}${metric('Focused tails',`${format(focus.underflow_count)} / ${format(focus.overflow_count)}`)}</div><div class="comparison"><article class="card accepted"><h3>Accepted baseline</h3><p>${displayText(f.accepted_baseline)}</p></article><article class="card proposal"><h3>Editable agent proposal</h3><div id="proposal-controls"></div></article></div><h3>Exact audited histogram</h3><div class="choices" id="preview-controls"></div><div id="chart"></div><p class="tail">Focused tails use the complete finite-population denominator and are never renormalized.</p><h3>Policy rationale</h3><ul class="rationale">${f.rationale.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Owner review</h3><div class="actions"><button data-disposition="accept-proposal">Accept proposal for record</button><button data-disposition="retain-baseline">Retain accepted baseline</button><button data-disposition="edited">Accept edited choice for record</button></div><label>Notes<textarea id="notes" placeholder="Optional review notes"></textarea></label>`;proposalControls(f,$('proposal-controls'));const preview=$('preview-controls'),scale=selectControl(scales(d),d.preferred_scale,draw),domain=selectControl(domains(d),d.preferred_distribution_domain,draw);scale.id='preview-scale';domain.id='preview-domain';preview.append('Preview ',scale,domain);function draw(){$('chart').innerHTML=chart(f,scale.value,domain.value)}draw();$('notes').value=notes.get(key(f))||'';$('notes').oninput=e=>notes.set(key(f),e.target.value);host.querySelectorAll('[data-disposition]').forEach(b=>{b.classList.toggle('active',dispositions.get(key(f))===b.dataset.disposition);b.onclick=()=>{if(b.dataset.disposition==='accept-proposal')decisions.set(key(f),clone(f.agent_proposal));if(b.dataset.disposition==='retain-baseline')decisions.set(key(f),clone(f.accepted_baseline));dispositions.set(key(f),b.dataset.disposition);renderList()}})}
function record(){return{format:'ibl-scalar-distribution-human-review-v1',source_lab:{format:report.format,policy_version:report.policy_version},production_effect:'none',datasets:report.datasets.map(d=>({dataset_id:d.dataset_id,representation:d.representation,source_release_id:d.source_release_id,audit_sha256:d.audit_sha256,accepted_selection_id:d.accepted_selection_id,accepted_selection_sha256:d.accepted_selection_sha256,features:d.features.map(f=>({id:f.id,disposition:dispositions.get(d.dataset_id+'\0'+f.id)||'unreviewed',display:clone(decisions.get(d.dataset_id+'\0'+f.id)),notes:notes.get(d.dataset_id+'\0'+f.id)||''}))}))}}
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record(),null,2)],{type:'application/json'}));a.download='q14-distribution-human-review.json';a.click();URL.revokeObjectURL(a.href)}
$('download').onclick=download;for(const id of ['search','only-diff','only-unreviewed','only-log','only-mixed','collapse'])$(id).oninput=renderList;tabs();renderList();
</script></body></html>
