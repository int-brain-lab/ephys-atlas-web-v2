[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibl-ephys-atlas-builder"
version = "0.1.0"
description = "Builder and validator for IBL Ephys Atlas Web v2 datasets"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "jsonschema>=4.20", "referencing>=0.32"]

[project.optional-dependencies]
test = ["pytest>=8", "shapely>=2.1,<2.2"]
scientific = [
    "iblatlas @ git+https://github.com/int-brain-lab/iblatlas.git@52083adf44825d0622a503705e095699a5957587",
    "ibleatools @ git+https://github.com/int-brain-lab/ibleatools.git@9bfa0623a16bc7a989a6b27a589887641beee0a8",
]
anatomy = [
    "brotli>=1.1,<2",
    "iblatlas @ git+https://github.com/int-brain-lab/iblatlas.git@52083adf44825d0622a503705e095699a5957587",
    "scikit-image>=0.26,<0.27",
    "shapely>=2.1,<2.2",
]

[project.scripts]
ephys-atlas-data = "ephys_atlas_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ephys_atlas_builder*"]
