[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibl-ephys-atlas"
version = "0.1.0"
description = "Authoring, builder, and validator tools for IBL Ephys Atlas datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pynrrd>=1.1,<2",
    "iblatlas>=1.2,<2",
    "jsonschema>=4.20",
    "referencing>=0.32",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.6,<9.7",
    "mkdocstrings[python]>=0.30,<1",
]
test = [
    "pandas>=3,<4",
    "pyarrow>=25,<26",
    "pytest>=8",
    "shapely>=2.1,<2.2",
]
scientific = [
    "botocore[crt]==1.43.75",
    "ibleatools @ git+https://github.com/int-brain-lab/ibleatools.git@647d7ba5e87ba986144bf5ef94620bb18ff49fd5",
]
anatomy = [
    "brotli>=1.1,<2",
    "scikit-image>=0.26,<0.27",
    "shapely>=2.1,<2.2",
]

[project.scripts]
ephys-atlas-data = "ephys_atlas_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ibl_ephys_atlas*", "ephys_atlas_builder*"]

[tool.setuptools.package-data]
ibl_ephys_atlas = ["_schema/v1/*"]

[tool.uv]
# ibleatools (scientific extra) requires Python >= 3.12; resolve and lock only for 3.12+
# without narrowing the published package's requires-python.
environments = ["python_version >= '3.12'"]

[tool.uv.sources]
iblatlas = { git = "https://github.com/int-brain-lab/iblatlas.git", rev = "b88da5d8541d77285565fdb3f86f4f69c50b9e68" }
