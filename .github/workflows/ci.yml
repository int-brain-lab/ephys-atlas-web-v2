name: CI

on:
  push:
    branches: [main, 'agent/**', 'work/**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e 'builder[test]' pytest
      - run: python -m pytest -q tests
      - run: python -m pip install -e publishing
      - run: python -m pytest -q publishing/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
