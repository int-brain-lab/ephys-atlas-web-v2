name: CI

on:
  push:
    branches: [main, 'agent/**', 'work/**']
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'builder[test]' pytest
      - run: python -m pytest -q tests
      - run: python -m pip install -e publishing
      - run: python -m pytest -q publishing/tests
      - name: Report Python status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'CI / python',
            });

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - id: typecheck
        continue-on-error: true
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          summary=$(grep -m1 'error TS' /tmp/typecheck.log | tr -d '\r' | cut -c1-110)
          echo "summary=${summary:-typecheck failed}" >> "$GITHUB_OUTPUT"
          exit "$status"
      - id: unit
        continue-on-error: true
        run: npm run test:unit
      - id: build
        continue-on-error: true
        run: npm run build
      - id: browser-install
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - id: browser
        if: always() && steps.browser-install.outcome == 'success'
        continue-on-error: true
        run: npm run test:browser
      - name: Report web statuses
        if: always()
        uses: actions/github-script@v7
        env:
          TYPECHECK_SUMMARY: ${{ steps.typecheck.outputs.summary }}
        with:
          script: |
            const outcomes = {
              'CI / web typecheck': '${{ steps.typecheck.outcome }}',
              'CI / web unit': '${{ steps.unit.outcome }}',
              'CI / web build': '${{ steps.build.outcome }}',
              'CI / web browser': '${{ steps.browser.outcome }}',
            };
            for (const [contextName, outcome] of Object.entries(outcomes)) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: contextName,
              });
            }
            if (outcomes['CI / web typecheck'] !== 'success') {
              const detail = (process.env.TYPECHECK_SUMMARY || 'typecheck failed').replace(/\s+/g, ' ').slice(0, 105);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: 'failure',
                context: `CI / diagnostic / ${detail}`,
              });
            }
            const state = Object.values(outcomes).every((value) => value === 'success') ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'CI / web',
            });
      - name: Fail failed web checks
        if: always()
        run: |
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.unit.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
