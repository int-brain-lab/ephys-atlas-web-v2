name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - run: uv sync --project builder --python 3.12 --extra test --locked
      - run: uv sync --project publishing --python 3.12 --extra test --locked
      - run: uv run --project builder --extra test --locked python -m pytest -q tests
      - run: uv run --project publishing --extra test --locked python -m pytest -q publishing/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:rendering
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
