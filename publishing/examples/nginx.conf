map $uri $atlas_cache_control {
    default                                  "public, max-age=60";
    ~^/data/datasets/[^/]+/releases/        "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl http2;
    server_name atlas-data.example.org;

    location /data/ {
        alias /srv/ephys-publish/storage/public/;
        add_header Cache-Control $atlas_cache_control always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }
}
