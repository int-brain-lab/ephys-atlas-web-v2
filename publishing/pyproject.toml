[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibl-ephys-atlas-publish"
version = "0.1.0"
description = "Minimal capability-based publishing service/client for IBL Ephys Atlas Web v2"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ephys-atlas-publish = "ibl_ephys_atlas_publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
